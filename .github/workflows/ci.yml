name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install system toolchain (P00 core/optional tools)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pandoc texlive-latex-extra graphviz qpdf poppler-utils
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: python -m pytest tests -q
